name: Deploy prospect site to GitHub Pages

on:
  push:
    branches: [main, claude/roofer-prospect-website-geo-8pagdw]
    paths: [prospects/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: prospects/cg-roofing-group
          publish_branch: gh-pages
